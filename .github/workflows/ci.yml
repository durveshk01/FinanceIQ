name: FinanceIQ CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies (Root)
        run: npm ci

      - name: Install dependencies (Render Backend)
        run: npm --prefix render-backend ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting and repository secrets
        run: |
          npm run format:check
          npm run audit:repository

      - name: Prepare offline parser assets
        run: npm run prepare:assets

      - name: Check dependency vulnerabilities
        run: |
          npm audit
          npm --prefix render-backend audit

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run Full Test Suite
        run: npm run test:all

      - name: Verify Production Web Build
        run: npm run build

      - name: Verify serverless PDF and OCR packaging
        run: npm run test:serverless

      - name: Build backend
        run: npm --prefix render-backend run build

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Verify desktop and mobile workflows
        run: npm run test:browser

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
