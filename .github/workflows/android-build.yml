name: Build & Release FinanceIQ Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies and prepare offline assets
        run: |
          npm ci
          npm --prefix render-backend ci
          npm run prepare:assets
      - name: Validate source and backend
        run: |
          npm run lint
          npm run format:check
          npm run audit:repository
          npm run typecheck
          npm run test:all
          npm --prefix render-backend run build
          npm audit
          npm --prefix render-backend audit
      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
      - name: Restore private release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FINANCEIQ_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p android/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/signing/financeiq-release.keystore
          chmod 600 android/signing/financeiq-release.keystore
      - name: Build and validate signed release APK
        env:
          FINANCEIQ_KEYSTORE_PATH: signing/financeiq-release.keystore
          FINANCEIQ_KEYSTORE_PASSWORD: ${{ secrets.FINANCEIQ_KEYSTORE_PASSWORD }}
          FINANCEIQ_KEY_ALIAS: ${{ secrets.FINANCEIQ_KEY_ALIAS }}
          FINANCEIQ_KEY_PASSWORD: ${{ secrets.FINANCEIQ_KEY_PASSWORD }}
        run: npm run build:android -- --release
      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/android/FinanceIQ-release.apk | tee dist/android/signature.txt
          node scripts/verify-release-gates.js certificate dist/android/signature.txt
      - name: Verify static client workflows
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser:static
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify signed Android offline and cold-restart workflows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FINANCEIQ_KEYSTORE_PATH: signing/financeiq-release.keystore
          FINANCEIQ_KEYSTORE_PASSWORD: ${{ secrets.FINANCEIQ_KEYSTORE_PASSWORD }}
          FINANCEIQ_KEY_ALIAS: ${{ secrets.FINANCEIQ_KEY_ALIAS }}
          FINANCEIQ_KEY_PASSWORD: ${{ secrets.FINANCEIQ_KEY_PASSWORD }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: FinanceIQVerificationAPI35
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-snapshot-load -no-snapshot-save -no-boot-anim -gpu swiftshader_indirect -no-audio -camera-back none -camera-front none
          script: npm run test:android -- --serial emulator-5554 --release
      - name: Upload native validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FinanceIQ-native-validation
          path: test-results/android/
          if-no-files-found: warn
      - name: Upload APK and validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinanceIQ-release
          path: |
            dist/android/FinanceIQ-release.apk
            dist/android/FinanceIQ-release.apk.sha256
            dist/android/build-info.json
            android/app/build/reports/lint-results-release.html
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > dist/android/releases.json
          node scripts/verify-release-gates.js collision dist/android/releases.json "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" dist/android/FinanceIQ-release.apk dist/android/FinanceIQ-release.apk.sha256 --verify-tag --repo "$GITHUB_REPOSITORY" --title "FinanceIQ $RELEASE_TAG" --notes-file RELEASE_NOTES.md
