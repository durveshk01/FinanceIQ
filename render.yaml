services:
  - type: web
    name: financeiq-api
    runtime: node
    plan: free
    rootDir: render-backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_CORS_ORIGIN
        value: "*"
