services:
  - type: web
    name: financeiq-api
    runtime: node
    plan: starter
    rootDir: render-backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: financeiq-data
      mountPath: /var/data/financeiq
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIRECTORY
        value: /var/data/financeiq
      - key: ALLOW_CORS_ORIGIN
        value: "https://financeiq-iota.vercel.app,https://localhost,http://localhost,capacitor://localhost"
      - key: TRUST_PROXY_HOPS
        value: "1"
